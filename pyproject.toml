[project]
name = "ztb-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cachetools>=5.0",
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1.0",
    "langchain-core>=1.5.4,<2.0.0",
    "langchain-milvus>=0.4.0",
    "langchain-openai>=1.5.0,<2.0.0",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11,<2.0.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "lark-oapi==1.7.3",
    "lxml>=5.0,<7.0",
    "markdown>=3.6,<4.0",
    "openai>=2.45,<4",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.5",
    "pymilvus>=2.4.5",
    "pymupdf>=1.24,<2.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "python-multipart>=0.0.9,<1.0",
    "rapidocr-onnxruntime>=1.4.4",
    "redis>=8.1.0",
    "setuptools>=65,<70",
    "tiktoken>=0.7.0,<0.9.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "langchain-community==0.3.31",
    "mypy>=2.3.1",
    "openai>=3.9.0",
    "pillow>=12.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ragas>=0.3.1",
    "ruff>=0.16.6",
]

# ── 工具链配置（整体框架优化执行计划 3.2）────────────────────────
# 说明：当前仅"报告不阻断"；等存量告警清理到阈值后再在 CI 中设为门禁。

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "archive", "scripts/archive", "test/legacy", "docs"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
# `test/_support/` 是测试共用基建包（P1 新增）。它不在仓库根下，ruff 默认会把它
# 当第三方模块 —— 显式声明为 first-party，导入分组才与项目内模块一致。
known-first-party = ["_support"]

[tool.ruff.lint.per-file-ignores]
# 入口脚本需先改 sys.path 再导入项目模块（E402 属有意为之）
"api/cli.py" = ["E402"]
"agent/__main__.py" = ["E402"]
"public_kb/__main__.py" = ["E402"]
"scripts/**" = ["E402"]
"test/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
# 渐进式：待 core/errors、core/observability 等新模块落地后再用 files 收窄范围

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q --strict-markers"
# 必须显式把仓库根放进 sys.path：`pytest`（console script）与 `python -m pytest` 行为不同 ——
# 前者不把 CWD 加入 sys.path，pytest 的 prepend 导入模式于是把 test/ 插到最前，
# 导致 `import core` 命中 test/core/（无 __init__.py，但仍是 namespace 包），
# 收集期直接报 141 条 "No module named 'core.config'"。
# 2026-11-27 GitHub CI 首次跑测试时踩到；local_ci.py 用 `python -m pytest`，所以本机不暴露。
pythonpath = ["."]
markers = [
    "unit: 纯离线单测（无外部依赖）",
    "integration: 需要桩件或本地 DB/Milvus",
    "e2e: 需要真实 LLM/Milvus/MySQL",
    "golden: 金标集回归（指标门禁）",
]

# L1 路由规则与 handoff 规则（W2-1 数据化）。
#
# 改规则只改本文件，不改代码；加载器见 orchestration/routing_rules.py。
#
# L1：确定性快路径，按顺序匹配，首个命中即返回 target（capability id）。
#   kind=regex   pattern 正则（含反斜杠必须用单引号）；flags 可选 [IGNORECASE]；
#   max_len 可选（限定问题长度上限，超长不匹配）
l1:
  - id: greeting
    target: general_chat
    kind: regex
    pattern: "^(你好|您好|嗨|哈喽|hello|hi|在吗|你是谁|你能做什么|介绍一下你自己)"
    flags: [IGNORECASE]
    max_len: 40
  - id: project_number
    target: price_inquiry
    kind: regex
    pattern: '\[[^\]]+\][A-Za-z0-9\-]{4,}|[A-Z]{2,}\d{4,}[-A-Za-z0-9]*'
  - id: doc_qa
    target: doc_qa
    kind: regex
    pattern: "上传|分析.{0,6}文档|解读.{0,6}合同|对比.{0,6}标书|文档问答|审阅.{0,6}(合同|标书)"

# handoff：agent 完成后，若来源 agent 匹配且问题含 keywords 中任一关键词 → 交接。
handoff:
  - from: price_inquiry
    to: knowledge_qa
    reason: 价格/标讯查询结果需政策法规解释
    keywords: [法律效力, 依据, 法规, 为什么, 解释, 政策, 合规, 规定, 条例, 法条, 第几条]

# agent_gate：**会话有文件时**是否把问题升级给 deep_agent（跨源编排）。
#
# 前置「带文件」是唯一确定性信号（Phase G-5）；下面只管「有文件时再判什么」。
# 实测（2026-09-13，49 条带文件金标集，scripts/diag_gate_criteria.py）：
#   当前配置（偏宽松）        误入 3.8% / 漏答 0~13% / 命中 87%
#   把 require_doc_ref 改 true 误入 0%   / 漏答 17~30%      ← 收紧方向
#   「问题长度 / 子句数」判据  漏答 78~87% —— **已实测证否，不要用**
#
# ⚠️ 词表与阈值是**在 49 条合成题上调的，属过拟合**；真实阈值须用线上采样
#    （scripts/sample_traces_for_golden.py）收集的真实提问校准 → 那时只改本文件。
agent_gate:
  enabled: true
  require_doc_ref: false
  keywords: [
    合规, 符合, 依据, 违反, 是否合法, 合法吗, 规定, 法规, 条例, 法条, 第几条, 法律,
    处罚, 不良记录, 失信, 中标记录, 采购记录, 工商, 企业信息, 过往, 有没有中标,
  ]
  # 「问题指向本文档」的正则（require_doc_ref=true 时生效）
  doc_ref_pattern: "这份|本标书|本文件|该文件|文件里|文件中|上传的|这几份|这两份|标书里|招标文件里|这份文件"

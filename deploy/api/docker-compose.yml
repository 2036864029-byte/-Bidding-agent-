# ============================================================
# ztb 主程序（业务应用）— Docker Compose
# ============================================================
# 用途：把业务代码容器化。**不含模型**——embedding/rerank/MinerU 是独立服务。
#
# 构建运行（仓库根目录）：
#   docker compose -f deploy/api/docker-compose.yml up -d --build
#   看日志： docker compose -f deploy/api/docker-compose.yml logs -f
#   停：     docker compose -f deploy/api/docker-compose.yml down
#
# ⚠️ 关键：**容器里的 127.0.0.1 是容器自己，不是宿主机**
#   本机依赖的服务（Milvus/MySQL/Redis/PG/隧道）都在宿主上，必须走 host.docker.internal。
#   下面是「本地验证」的取值；**上服务器时**改为（应用与模型同机）：
#     EMBEDDING_BASE_URL: http://ztb-models:8000/v1     （同 docker 网络，见 networks）
#     PDF_PARSE_BASE_URL: http://ztb-mineru-api:8000
#     MILVUS_HOST / MYSQL_HOST / CACHE_REDIS_URL / CHECKPOINTER_POSTGRES_URL → 各云上组件
# ============================================================

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/api/Dockerfile
      args:
        # 服务器 Docker Hub 直连不通 → 传 docker.m.daocloud.io/library/python:3.11-slim
        BASE_IMAGE: ${API_BASE_IMAGE:-python:3.11-slim}
    image: ztb-api:latest
    container_name: ztb-api
    restart: unless-stopped

    # .env 提供密钥与业务配置；下面的 environment 覆盖其中指向宿主地址的项
    env_file:
      - ../../.env
    environment:
      API_HOST: "0.0.0.0"          # 容器内必须监听 0.0.0.0 才能被宿主映射到
      API_PORT: "8000"
      # —— 以下覆盖 .env 里指向 127.0.0.1 的地址（容器内那是指自己）——
      MILVUS_HOST: "host.docker.internal"
      MYSQL_HOST: "host.docker.internal"
      # ⚠️ 这一项同时是 FILE_STORE / JOB_QUEUE 的 Redis 地址：那两个变量在 .env 里
      # **刻意留空**，取的就是本值的回退。改这里即可，别在 .env 里写死 localhost
      # （那会让容器指向自己 → 多 worker 下上传文件与任务状态全部 404）。
      CACHE_REDIS_URL: "redis://host.docker.internal:6380/0"
      CHECKPOINTER_POSTGRES_URL: "postgresql://ztb:ztb_dev_pw@host.docker.internal:5433/ztb_checkpoints"
      EMBEDDING_BASE_URL: "http://host.docker.internal:18003/v1"   # SSH 隧道 → 云上模型服务
      PDF_PARSE_BASE_URL: "http://host.docker.internal:18002"      # SSH 隧道 → 云上 MinerU
      LANGFUSE_HOST: "http://host.docker.internal:3000"

    # Linux 上 host.docker.internal 需显式映射（Docker Desktop 自带，无需）
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "${API_PUBLISH_PORT:-8000}:8000"

    volumes:
      # 检查点/缓存/manifest 等运行时数据 → 卷挂载，不进镜像
      - ../../DATA:/app/DATA

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ============================================================
  # 飞书通道（入站：收消息 → 调 /chat → 回消息）
  # ============================================================
  # 为什么是**独立服务**而不是塞进 api：
  #   1. 飞书用出站 WebSocket 长连接（`lark_oapi.ws.Client`），`ws.start()` 是阻塞调用
  #      且 SDK 没有 `stop()` —— 放进 FastAPI lifespan 无法优雅关停，`--reload` 还会反复建连；
  #   2. API 支持 `API_WORKERS>1`，每多一个 worker 就多一条长连接，事件被分摊，
  #      某个 worker 重启的窗口里消息会丢；
  #   3. 设计上（channels/feishu/backend.py）通道只通过 HTTP 调后端，
  #      **不在进程内再起一张 AgentGraph**。
  # 但"独立"不等于"手动"：和 api 一起 `docker compose up -d` 起来，
  # `restart: unless-stopped` 保活，健康检查读心跳文件。
  #
  # 它**不需要任何入站端口**（长连接是出站）；容器需能出网访问 open.feishu.cn。
  feishu:
    # 与 api 同一个镜像：Dockerfile 已 COPY channels/
    image: ztb-api:latest
    container_name: ztb-feishu
    restart: unless-stopped
    command: ["python", "-m", "channels.feishu"]

    # 等 api 健康再起：否则 bot 启动后第一批消息会撞到"后端不可用"
    depends_on:
      api:
        condition: service_healthy

    env_file:
      - ../../.env

    environment:
      # 缺这三个时入口会直接 exit(2)，配了 restart 会变成重启循环 —— 上线前必须确认
      FEISHU_ENABLED: "true"
      # ⚠️ 容器内的 127.0.0.1 是它自己：必须用 compose 服务名
      FEISHU_BACKEND_BASE_URL: "http://api:8000"
      # 心跳/指标：健康检查与 Prometheus 抓取用
      FEISHU_HEARTBEAT_PATH: "/app/DATA/feishu_heartbeat.json"
      FEISHU_METRICS_PORT: "9100"

    volumes:
      # 心跳文件落在共享的 DATA 卷里（也可让 api 侧读来做聚合健康检查）
      - ../../DATA:/app/DATA

    # 需要本机抓取指标时再打开（只绑回环，不对外）
    # ports:
    #   - "127.0.0.1:9100:9100"

    healthcheck:
      # 判"通道还活着"：心跳新鲜 + 状态不是 stopped/failed。
      # 比 ping 进程更准 —— 进程在但长连接僵死同样会失败。
      test: ["CMD", "python", "-m", "channels.feishu.telemetry",
             "--check", "/app/DATA/feishu_heartbeat.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

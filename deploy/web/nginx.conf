# ============================================================
# ztb 站点 nginx 配置（百度云轻量 / 与现有 openagent-lab.top 并存）
# ============================================================
# 放置：/etc/nginx/conf.d/ztb.conf
# 作用：只新增一个 server 块，**不改动**你现有的 openagent-lab.top 配置。
#
# 前端：/var/www/ztb        ← frontend 的 `npm run build` 产物
# 后端：127.0.0.1:8000      ← ztb-api 容器映射到宿主回环，不对外暴露端口
#
# 要点：
#   1. 前端 `BASE = import.meta.env.VITE_API_BASE ?? '/api'` —— 生产不设该变量，
#      所有请求打 `/api/*`，这里 `proxy_pass http://ztb_api/;` 尾斜杠会剥掉 `/api`。
#   2. **SSE 必须 proxy_buffering off**，否则流式对话会攒到最后一次性吐。
#   3. 上传走 client_max_body_size，后端限制之外这里也要放开。
# ============================================================

upstream ztb_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name ztb.openagent-lab.top;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.25.1+ 用下面两行；更老的版本合并成 `listen 443 ssl http2;`
    listen 443 ssl;
    http2 on;
    server_name ztb.openagent-lab.top;

    # ⚠️ 换成你的实际证书路径。若证书只签了主域，子域需要单独签一张
    ssl_certificate     /etc/nginx/ssl/openagent-lab.top.pem;
    ssl_certificate_key /etc/nginx/ssl/openagent-lab.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root  /var/www/ztb;
    index index.html;
    charset utf-8;

    # ── 压缩 ──
    # Debian/Ubuntu 的 nginx 默认 `gzip_types` **只有 text/html**，js/css 一律不压缩。
    # 本项目入口 chunk 未压缩约 800KB，gzip 后约 244KB —— 不配这几行等于多传 500KB+。
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/css text/plain application/javascript application/json
                    application/manifest+json image/svg+xml;

    # ── 静态资源：Vite 产物带内容 hash，可长缓存 ──
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA 路由回退（/chat /modules /inquiry … 都是前端路由）──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 后端 API（剥掉 /api 前缀）──
    location /api/ {
        proxy_pass http://ztb_api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE 流式
        proxy_buffering         off;
        proxy_cache             off;
        chunked_transfer_encoding on;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;

        # 上传标书 / 合同 / 表格
        client_max_body_size 64m;
    }
}

# ============================================================
# ztb 站点 nginx 配置（百度云轻量 / 与现有 openagent-lab.top 并存）
# ============================================================
# 放置：/etc/nginx/conf.d/ztb.conf
# 作用：只新增一个 server 块，**不改动**你现有的 openagent-lab.top 配置。
#
# 前端：/var/www/ztb        ← frontend 的 `npm run build` 产物
# 后端：127.0.0.1:8000      ← ztb-api 容器映射到宿主回环，不对外暴露端口
# 证书：/etc/letsencrypt/live/ztb.openagent-lab.top/ ← certbot --webroot 单独签的子域证书
#       （主域那张 CN 只有 openagent-lab.top、无 SAN，**不覆盖**子域，必须单独签）
#
# 要点：
#   1. 前端 `BASE = import.meta.env.VITE_API_BASE ?? '/api'` —— 生产不设该变量，
#      所有请求打 `/api/*`，这里 `proxy_pass http://ztb_api/;` 尾斜杠会剥掉 `/api`。
#   2. **SSE 必须 proxy_buffering off**，否则流式对话会攒到最后一次性吐。
#   3. 上传走 client_max_body_size，后端限制之外这里也要放开。
#   4. 80 端口的 `/.well-known/acme-challenge/` **必须保留**：certbot 的 webroot
#      续期（certbot renew）要靠它，删掉则 90 天后自动续期会失败。
# ============================================================

upstream ztb_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP → HTTPS（放行 ACME 校验路径）
server {
    listen 80;
    listen [::]:80;
    server_name ztb.openagent-lab.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 服务器实测 nginx 1.24.0 —— `http2 on;` 是 1.25.1+ 语法，1.24 会报
    # `unknown directive "http2"`，必须把 http2 合并进 listen。
    # 这里**不写** `listen [::]:443`：主站 vhost 已占用 `[::]:443 ssl ipv6only=on`，
    # 同一 socket 上重复声明选项会报 `protocol options redefined` 警告；
    # 且 ztb 只有 A 记录（无 AAAA），IPv6 客户端本来就到不了这里。
    listen 443 ssl http2;
    server_name ztb.openagent-lab.top;

    ssl_certificate     /etc/letsencrypt/live/ztb.openagent-lab.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ztb.openagent-lab.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root  /var/www/ztb;
    index index.html;
    charset utf-8;

    # ── 压缩 ──
    # Debian/Ubuntu 的 nginx 默认 `gzip_types` **只有 text/html**，js/css 一律不压缩。
    # 本项目入口 chunk 未压缩约 800KB，gzip 后约 245KB —— 不配这几行等于多传 500KB+。
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/css text/plain application/javascript application/json
                    application/manifest+json image/svg+xml;

    # ── 静态资源：Vite 产物带内容 hash，可长缓存 ──
    # ⚠️ 不要同时写 `expires` 和 `add_header Cache-Control`：两者会各发一条
    #    Cache-Control 头（`max-age=2592000` + `public, immutable`），语义重复。
    #    只保留一条合并写法。
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ── SPA 路由回退（/chat /modules /inquiry … 都是前端路由）──
    # index.html 必须 no-cache：否则发版后浏览器仍拿旧 HTML、引用已删除的 assets hash → 白屏
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # ── 运维接口只给本机（公网 403）──
    # /metrics 暴露模型名、内部槽位、token 用量、进程内存/fd 与 Python 版本；
    # /docs + /openapi.json 把 14 个接口的完整 schema 摊开。不是漏洞，但没必要
    # 对公网发地图。用 allow/deny 而非直接下掉：服务器上 `curl 127.0.0.1` 仍可看，
    # 排障不受影响。**正则 location 优先于下面的前缀 `/api/`**，顺序上放前面更直观。
    #
    # ⚠️ 三个容易写错的地方（2026-11-28 实测踩到）：
    #   1. 正则 location 里只有 allow/deny 是不够的 —— 没有内容处理器时 nginx 会去
    #      `root` 里找文件，放行者也拿到 404。必须自己带上 proxy_pass。
    #   2. 正则 location 里写 `proxy_pass http://upstream/;`（带 URI）行为不直观，
    #      所以这里用 `rewrite ... break` 先把 /api 前缀剥掉，再 `proxy_pass` **不带 URI**。
    #   3. 别忘 allow ::1；只放行 127.0.0.1 时，走 IPv6 回环的请求会被拒。
    location ~ ^/api/(metrics|docs|redoc|openapi\.json)$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://ztb_api;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── 后端 API（剥掉 /api 前缀）──
    location /api/ {
        proxy_pass http://ztb_api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE 流式
        proxy_buffering         off;
        proxy_cache             off;
        chunked_transfer_encoding on;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;

        # 上传标书 / 合同 / 表格
        client_max_body_size 64m;
    }
}
